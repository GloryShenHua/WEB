<div class="flex-1 flex flex-col p-4 overflow-hidden">
  <ng-container *ngIf="step() as s">

    <div class="flex gap-4 flex-1 min-h-0">

      <!-- SVG Graph -->
      <div class="flex-1 bg-slate-900/50 rounded-xl border border-slate-700 overflow-hidden">
        <svg width="100%" height="100%" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid meet">
          <!-- Edges -->
          <g *ngFor="let e of edges(); trackBy: trackByEdge">
            <line
              [attr.x1]="e.x1" [attr.y1]="e.y1"
              [attr.x2]="e.x2" [attr.y2]="e.y2"
              [attr.stroke]="edgeColor(e.state)"
              [attr.stroke-width]="edgeWidth(e.state)"
              stroke-linecap="round"
              style="transition: stroke 0.3s ease" />
            <text *ngIf="store.graphData().weighted"
              [attr.x]="e.midX" [attr.y]="e.midY - 5"
              text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">
              {{ e.weight }}
            </text>
          </g>

          <!-- Nodes -->
          <g *ngFor="let n of nodes(); trackBy: trackById">
            <circle
              [attr.cx]="n.x" [attr.cy]="n.y" r="20"
              [attr.fill]="nodeColor(n.state)"
              stroke="#1e293b" stroke-width="2"
              style="transition: fill 0.3s ease" />
            <text
              [attr.x]="n.x" [attr.y]="n.y + 4"
              text-anchor="middle" fill="white"
              font-size="13" font-weight="bold" font-family="sans-serif">
              {{ n.label }}
            </text>
            <!-- Distance label -->
            <text *ngIf="s.distances && s.distances[n.id] !== undefined && s.distances[n.id] < 1e8"
              [attr.x]="n.x" [attr.y]="n.y + 34"
              text-anchor="middle" fill="#60a5fa" font-size="10" font-family="monospace">
              {{ s.distances[n.id] }}
            </text>
          </g>
        </svg>
      </div>

      <!-- Side info -->
      <div class="w-48 flex flex-col gap-2 text-xs">
        <div *ngIf="s.queue.length > 0" class="bg-slate-800 rounded-lg p-2 border border-slate-700">
          <div class="text-slate-500 mb-1">队列</div>
          <div class="flex flex-wrap gap-1">
            <span *ngFor="let n of s.queue" class="px-1.5 py-0.5 bg-yellow-600/30 text-yellow-400 rounded font-mono">{{ n }}</span>
          </div>
        </div>
        <div *ngIf="s.stack.length > 0" class="bg-slate-800 rounded-lg p-2 border border-slate-700">
          <div class="text-slate-500 mb-1">栈</div>
          <div class="flex flex-wrap gap-1">
            <span *ngFor="let n of s.stack" class="px-1.5 py-0.5 bg-purple-600/30 text-purple-400 rounded font-mono">{{ n }}</span>
          </div>
        </div>
        <div *ngIf="s.path.length > 0" class="bg-slate-800 rounded-lg p-2 border border-slate-700">
          <div class="text-slate-500 mb-1">路径</div>
          <div class="text-green-400 font-mono">{{ s.path.join(' → ') }}</div>
          <div *ngIf="s.pathLength > 0" class="text-slate-500 mt-1">总长: {{ s.pathLength }}</div>
        </div>
        <div *ngIf="s.mstCost !== undefined" class="bg-slate-800 rounded-lg p-2 border border-slate-700">
          <div class="text-slate-500 mb-1">MST 权重</div>
          <div class="text-green-400 font-mono">{{ s.mstCost }}</div>
        </div>
        <div class="bg-slate-800 rounded-lg p-2 border border-slate-700">
          <div class="text-slate-500 mb-1">统计</div>
          <div class="text-slate-300">
            已访问: {{ step()?.visitedCount ?? 0 }} / {{ store.graphData().nodes.length }}
            <span class="text-blue-400 ml-1">({{ visitedRatio() }}%)</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-1.5 mt-1">
            <div class="bg-blue-500 h-1.5 rounded-full transition-all duration-300"
              [style.width.%]="visitedRatio()"></div>
          </div>
          <div class="text-slate-300 mt-1.5">比较次数: {{ step()?.comparisons ?? 0 }}</div>
        </div>
      </div>
    </div>

    <!-- Description -->
    <div class="flex-shrink-0 mt-2 p-3 bg-slate-800/60 rounded-lg border border-slate-700">
      <p class="text-sm text-slate-200">{{ s.description }}</p>
    </div>
  </ng-container>
</div>
