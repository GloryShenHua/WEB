<div class="h-full min-h-0 grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_360px] bg-slate-950 text-white overflow-hidden">
  <section class="min-h-0 flex flex-col bg-slate-950">
    <div class="px-4 py-2 border-b border-slate-800 bg-slate-950/90 flex-shrink-0">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="text-sm font-semibold text-white truncate">{{ currentInfo.title }}</p>
          <p class="text-xs text-slate-400 truncate">{{ operationStatus }}</p>
        </div>
        <span class="text-xs text-slate-500 shrink-0">拖拽旋转，滚轮缩放，右键平移</span>
      </div>
    </div>

    <div class="flex-1 min-h-0 p-3">
      <div class="relative h-full min-h-0 overflow-hidden rounded-lg border border-slate-700 bg-slate-950">
        <div #canvasContainer class="absolute inset-0"></div>
      </div>
    </div>
  </section>

  <aside class="min-h-0 border-l border-slate-700 bg-slate-900 overflow-auto">
    <section class="p-4 border-b border-slate-700">
      <h2 class="text-lg font-bold">Web3D 数据结构学习</h2>
      <p class="text-sm text-slate-300 leading-6 mt-2">{{ currentInfo.definition }}</p>
    </section>

    <section class="p-4 border-b border-slate-700">
      <h3 class="text-sm font-semibold text-blue-300 mb-2">结构选择</h3>
      <div class="grid grid-cols-2 gap-2">
        <button
          *ngFor="let item of structureOptions"
          (click)="selectStructure(item.type)"
          [class]="selected() === item.type
            ? 'px-2.5 py-2 rounded-md text-xs bg-blue-600 text-white'
            : 'px-2.5 py-2 rounded-md text-xs bg-slate-800 text-slate-300 hover:bg-slate-700'">
          {{ item.label }}
        </button>
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2">
        <button
          (click)="randomData()"
          class="rounded-md bg-slate-800 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700">
          随机数据
        </button>
        <button
          (click)="resetView()"
          class="rounded-md bg-slate-800 px-3 py-2 text-xs font-medium text-slate-200 hover:bg-slate-700">
          重置视角
        </button>
      </div>
    </section>

    <section class="p-4 border-b border-slate-700">
      <h3 class="text-sm font-semibold text-blue-300 mb-2">结构特点</h3>
      <ul class="space-y-1.5 text-sm text-slate-300">
        <li *ngFor="let feature of currentInfo.features" class="flex gap-2">
          <span class="mt-1 h-1.5 w-1.5 rounded-full bg-blue-400 shrink-0"></span>
          <span>{{ feature }}</span>
        </li>
      </ul>
    </section>

    <section class="p-4 border-b border-slate-700">
      <h3 class="text-sm font-semibold text-green-300 mb-2">操作动画</h3>
      <div class="space-y-2">
        <div *ngFor="let op of currentInfo.operations" class="rounded-lg border border-slate-700 bg-slate-800 p-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-sm font-semibold">{{ op.name }}</span>
            <span class="font-mono text-xs text-purple-300">{{ op.complexity }}</span>
          </div>
          <p class="text-xs text-slate-400 leading-5 mt-1">{{ op.description }}</p>
          <button
            (click)="performOperation(op.name)"
            class="mt-2 w-full rounded-md bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-500">
            演示操作
          </button>
        </div>
      </div>
    </section>

    <section class="p-4 border-b border-slate-700">
      <h3 class="text-sm font-semibold text-yellow-300 mb-2">交互练习</h3>
      <p class="text-sm text-slate-300 mb-2">{{ practicePrompt }}</p>
      <div class="flex gap-2">
        <input
          [(ngModel)]="practiceAnswer"
          class="min-w-0 flex-1 rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white outline-none focus:border-blue-500"
          placeholder="输入答案" />
        <button
          (click)="checkPractice()"
          class="rounded-md bg-emerald-600 px-3 py-2 text-sm font-medium text-white hover:bg-emerald-500">
          提交
        </button>
      </div>
      <div
        *ngIf="practiceFeedback"
        [class]="practiceFeedback.ok
          ? 'mt-2 rounded-md border border-emerald-700 bg-emerald-950/60 px-3 py-2 text-sm text-emerald-200'
          : 'mt-2 rounded-md border border-red-700 bg-red-950/60 px-3 py-2 text-sm text-red-200'">
        {{ practiceFeedback.text }}
      </div>
    </section>

    <section class="p-4">
      <h3 class="text-sm font-semibold text-purple-300 mb-2">典型应用</h3>
      <div class="flex flex-wrap gap-1.5">
        <span
          *ngFor="let use of currentInfo.useCases"
          class="rounded-md bg-slate-800 px-2 py-1 text-xs text-slate-300">
          {{ use }}
        </span>
      </div>
    </section>
  </aside>
</div>
