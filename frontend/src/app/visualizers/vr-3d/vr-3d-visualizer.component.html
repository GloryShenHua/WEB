<div class="h-full min-h-0 flex flex-col bg-slate-950 text-white overflow-hidden">

    <div class="flex items-center gap-2 px-4 py-3 border-b border-slate-700 bg-slate-900">
        <span class="text-sm text-slate-400 font-semibold">VR/3D 数据结构模式</span>

        <span class="text-xs text-blue-300">
            当前结构：{{ currentInfo.title }}
        </span>

        <span class="ml-auto text-xs text-slate-500">
          鼠标拖拽旋转，滚轮缩放，右键平移
        </span>
    </div>

    <div class="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-3 overflow-hidden">

        <div class="xl:col-span-2 min-h-0 flex items-center justify-center p-6 bg-slate-950">
            <div class="relative w-full max-w-5xl h-[72vh] max-h-[720px] min-h-[420px] rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 shadow-2xl shadow-blue-950/30">
                <div #canvasContainer class="absolute inset-0"></div>
            </div>
        </div>

        <aside class="border-l border-slate-700 bg-slate-900/90 p-4 overflow-auto">
            <h2 class="text-lg font-bold mb-2">{{ currentInfo.title }}</h2>

            <section class="mb-4">
                <h3 class="text-sm font-semibold text-blue-300 mb-1">定义</h3>
                <p class="text-sm text-slate-300 leading-6">{{ currentInfo.definition }}</p>
            </section>

            <section class="mb-4">
                <h3 class="text-sm font-semibold text-green-300 mb-1">特点</h3>
                <ul class="list-disc list-inside text-sm text-slate-300 space-y-1">
                    <li *ngFor="let f of currentInfo.features">{{ f }}</li>
                </ul>
            </section>

            <section class="mb-4">
                <h3 class="text-sm font-semibold text-yellow-300 mb-1">核心操作与复杂度</h3>
                <div class="space-y-2">
                    <div *ngFor="let op of currentInfo.operations" class="bg-slate-800 rounded p-2">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-semibold">{{ op.name }}</span>
                            <div class="flex items-center gap-2">
                                <span class="font-mono text-purple-300">{{ op.complexity }}</span>
                                <button
                                        (click)="performOperation(op.name)"
                                        class="px-2 py-0.5 rounded bg-blue-600 hover:bg-blue-500 text-xs text-white transition"
                                        title="动画演示此操作">
                                    ▶ 演示
                                </button>
                            </div>
                        </div>
                        <p class="text-xs text-slate-400 mt-1">{{ op.description }}</p>
                    </div>
                </div>
            </section>

            <section>
                <h3 class="text-sm font-semibold text-purple-300 mb-1">典型应用</h3>
                <div class="flex flex-wrap gap-1.5">
              <span
                      *ngFor="let use of currentInfo.useCases"
                      class="px-2 py-1 rounded bg-slate-800 text-xs text-slate-300">
                {{ use }}
              </span>
                </div>
            </section>
        </aside>

    </div>
</div>
