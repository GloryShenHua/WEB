<div class="min-h-screen bg-slate-950 text-white flex">
  <section class="hidden lg:flex w-[46%] bg-slate-900 border-r border-slate-800 px-12 py-10 flex-col justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-xl font-bold">A</div>
      <div>
        <h1 class="text-lg font-bold leading-none">算法可视化学习平台</h1>
        <p class="text-xs text-slate-500 mt-1">Algorithm Visualization</p>
      </div>
    </div>

    <div class="max-w-md">
      <p class="text-sm text-blue-400 font-semibold mb-3">学习、演示、复盘</p>
      <h2 class="text-4xl font-bold leading-tight">用可视化步骤理解算法的每一次决策。</h2>
      <p class="text-sm text-slate-400 leading-6 mt-5">
        登录后进入排序、搜索、图算法、动态规划和回溯算法的统一实验环境，保留你的本地访问状态。
      </p>
    </div>

    <div class="grid grid-cols-3 gap-3 text-xs">
      <div class="border border-slate-700 bg-slate-800/70 rounded-lg p-3">
        <div class="text-slate-400">算法类别</div>
        <div class="text-2xl font-bold mt-1">5</div>
      </div>
      <div class="border border-slate-700 bg-slate-800/70 rounded-lg p-3">
        <div class="text-slate-400">图编辑</div>
        <div class="text-2xl font-bold mt-1">实时</div>
      </div>
      <div class="border border-slate-700 bg-slate-800/70 rounded-lg p-3">
        <div class="text-slate-400">运行记录</div>
        <div class="text-2xl font-bold mt-1">可查</div>
      </div>
    </div>
  </section>

  <main class="flex-1 flex items-center justify-center px-5 py-8">
    <div class="w-full max-w-md">
      <div class="lg:hidden flex items-center gap-3 mb-8">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-xl font-bold">A</div>
        <div>
          <h1 class="text-lg font-bold leading-none">算法可视化学习平台</h1>
          <p class="text-xs text-slate-500 mt-1">Algorithm Visualization</p>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-700 rounded-lg p-6 shadow-xl shadow-black/20">
        <div class="flex bg-slate-800 rounded-lg p-1 mb-6">
          <button
            type="button"
            (click)="switchMode('login')"
            [class]="mode === 'login'
              ? 'flex-1 py-2 rounded-md bg-blue-600 text-white text-sm font-medium'
              : 'flex-1 py-2 rounded-md text-slate-400 hover:text-white text-sm font-medium'">
            登录
          </button>
          <button
            type="button"
            (click)="switchMode('register')"
            [class]="mode === 'register'
              ? 'flex-1 py-2 rounded-md bg-blue-600 text-white text-sm font-medium'
              : 'flex-1 py-2 rounded-md text-slate-400 hover:text-white text-sm font-medium'">
            注册
          </button>
        </div>

        <form *ngIf="mode === 'login'" (ngSubmit)="submitLogin()" class="space-y-4">
          <div *ngIf="auth.success()" class="text-sm text-emerald-300 bg-emerald-950/60 border border-emerald-800 rounded px-3 py-2">
            {{ auth.success() }}
          </div>

          <div>
            <label class="block text-sm text-slate-400 mb-1.5">用户名</label>
            <input
              name="loginUsername"
              type="text"
              autocomplete="username"
              [(ngModel)]="loginUsername"
              class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-blue-500"
              placeholder="请输入用户名">
          </div>

          <div>
            <label class="block text-sm text-slate-400 mb-1.5">密码</label>
            <input
              name="loginPassword"
              type="password"
              autocomplete="current-password"
              [(ngModel)]="loginPassword"
              class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-blue-500"
              placeholder="请输入密码">
          </div>

          <div *ngIf="auth.error()" class="text-sm text-red-300 bg-red-950/60 border border-red-800 rounded px-3 py-2">
            {{ auth.error() }}
          </div>

          <button
            type="submit"
            [disabled]="auth.isLoading()"
            class="w-full py-2.5 rounded bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white font-semibold">
            {{ auth.isLoading() ? '正在登录...' : '登录平台' }}
          </button>
        </form>

        <form *ngIf="mode === 'register'" (ngSubmit)="submitRegister()" class="space-y-4">
          <div>
            <label class="block text-sm text-slate-400 mb-1.5">用户名</label>
            <input
              name="registerUsername"
              type="text"
              autocomplete="username"
              [(ngModel)]="registerUsername"
              class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-blue-500"
              placeholder="至少 3 个字符">
          </div>

          <div>
            <label class="block text-sm text-slate-400 mb-1.5">显示名称</label>
            <input
              name="registerDisplayName"
              type="text"
              [(ngModel)]="registerDisplayName"
              class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-blue-500"
              placeholder="用于页面右上角显示">
          </div>

          <div>
            <label class="block text-sm text-slate-400 mb-1.5">密码</label>
            <input
              name="registerPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="registerPassword"
              class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-blue-500"
              placeholder="至少 6 个字符">
          </div>

          <div>
            <label class="block text-sm text-slate-400 mb-1.5">确认密码</label>
            <input
              name="registerConfirmPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="registerConfirmPassword"
              class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-blue-500"
              placeholder="再次输入密码">
          </div>

          <div *ngIf="auth.error()" class="text-sm text-red-300 bg-red-950/60 border border-red-800 rounded px-3 py-2">
            {{ auth.error() }}
          </div>

          <button
            type="submit"
            [disabled]="auth.isLoading()"
            class="w-full py-2.5 rounded bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white font-semibold">
            {{ auth.isLoading() ? '正在创建...' : '创建账号' }}
          </button>
        </form>
      </div>
    </div>
  </main>
</div>
